<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>Proteggi oggi ciò che conta domani</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: left rail with the 4 pillars + LTC and their ticks, one big slide at a time, large bottom nav for desktop and tablet. */
:root{
  --red:#C41A16; --red-deep:#A31410; --coral:#FF6B63; --sun:#FFC93C; --navy:#1F2A44; --leaf:#2E8F5E;
  --paper:#FBF6F0; --ink:#1F1F24; --card:#FFFFFF; --muted:#5E5A60; --blush:#F9E1DC; --accpaper:#C41A16;
  --chrome:#FFFFFF; --chromefg:#1F1F24; --line:#E7DAD1; --soft:#F6EEE8;
  --fd:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fb:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1D1416; --ink:#F7EDE8; --card:#2A1B1E; --muted:#C8B5B0; --blush:#3A2024; --accpaper:#FF6B63; --leaf:#5CCB91;
  --chrome:#121214; --chromefg:#F7EDE8; --line:#3A2A2D; --soft:#1B1B1F; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1D1416; --ink:#F7EDE8; --card:#2A1B1E; --muted:#C8B5B0; --blush:#3A2024; --accpaper:#FF6B63; --leaf:#5CCB91;
  --chrome:#121214; --chromefg:#F7EDE8; --line:#3A2A2D; --soft:#1B1B1F; color-scheme:dark}
*{box-sizing:border-box}
html{font-size:clamp(16px,.55vw + 11px,22px)}
html,body{height:100%}
body{margin:0;background:var(--chrome);color:var(--chromefg);font-family:var(--fb);font-size:1rem;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr)}
.main{display:flex;flex-direction:column;min-height:0;min-width:0}

/* rail */
.rail{position:fixed;top:0;bottom:0;left:0;z-index:60;width:min(88vw,18rem);transform:translateX(-105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s;display:flex;flex-direction:column;gap:6px;overflow-y:auto;border-right:1px solid var(--line);background:var(--chrome);
  padding-top:18px;padding-bottom:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:14px}
.brand{font-family:var(--fd);font-weight:800;font-size:1.25rem;color:var(--red);letter-spacing:.01em}
.brandsub{font-size:.82rem;color:var(--muted);margin-bottom:12px}
.rl{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:12px 0 2px}
.ri{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:14px;padding:10px 12px;min-height:52px;transition:background .2s,border-color .2s}
.ri:hover{background:var(--soft)}
.ri[aria-current="true"]{background:var(--soft);border-color:var(--red)}
.ri b{display:block;font-family:var(--fd);font-size:1.02rem;line-height:1.15}
.ri small{display:block;color:var(--muted);font-size:.78rem}
.dot{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:var(--chrome);transition:background .3s,border-color .3s,transform .3s}
.dot svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4);transition:opacity .25s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.done .dot{background:var(--leaf);border-color:var(--leaf);transform:scale(1.05)}
.done .dot svg{opacity:1;transform:none}
.dot.n{font-weight:700;font-size:.85rem;color:var(--muted)}
.done .dot.n{color:#fff}
.railfoot{margin-top:auto;font-size:.78rem;color:var(--muted);padding-top:12px}

.rail.shown{transform:none;visibility:visible;transition-delay:0s;box-shadow:0 0 48px rgba(0,0,0,.35)}
.scrim{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.4);opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
.scrim.shown{opacity:1;visibility:visible;transition-delay:0s}
.rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.rx{flex:none;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center}
.rx svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round}
/* menu laterale: pannello rosso, scritte bianche sullo sfondo, scritte nere nei riquadri bianchi (colori propri, uguali in chiaro e scuro) */
.rail{--rbg:#C41A16;--rtx:#FFFFFF;--rink:#000000;--rln:#000000;--rgn:#1F7A4D;--rhov:#F1F1F1;color-scheme:light;top:max(10px,env(safe-area-inset-top,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));left:max(10px,env(safe-area-inset-left,0px));width:min(86vw,19.5rem);border:1.5px solid var(--rln);border-radius:26px;background:var(--rbg);color:var(--rtx);padding:20px 12px 14px;gap:6px;overflow:hidden;transform:translateX(-112%);transition:transform .5s cubic-bezier(.22,.8,.24,1),visibility 0s .5s,box-shadow .5s}
.rail.shown{box-shadow:0 34px 80px -30px rgba(0,0,0,.6)}
.scrim{background:rgba(31,24,26,.3);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.rail .rhead{align-items:center;padding:0 6px 10px 10px}
.rail .rhead .brand{font-size:1.2rem;color:var(--rtx)}
.rail .brandsub{font-size:.82rem;color:var(--rtx);margin:2px 0 0}
.rail .rx{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--rln);background:#fff;color:var(--rink);transition:background .2s}
.rail .rx:hover{background:var(--rhov)}
.rail .rx svg{width:16px;height:16px}
.rail .rscroll{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:2px 2px 6px}
.rail .rl{font-size:.68rem;font-weight:700;letter-spacing:.18em;color:var(--rtx);opacity:1;margin:10px 10px 0}
.rail .ri{min-height:0;border:1.5px solid var(--rln);background:#fff;border-radius:16px;padding:7px 9px;gap:11px;color:var(--rink)}
.rail .ri:hover{background:var(--rhov)}
.rail .ri b{font-family:var(--fb);font-weight:700;font-size:.97rem;color:var(--rink)}
.rail .ri small{font-size:.79rem;font-weight:500;color:var(--rink);opacity:1}
.rail .ri[aria-current="true"]{background:#fff;border-width:2.5px;padding:6px 8px}
.rail .dot{width:26px;height:26px;border:1.5px solid var(--rln);background:#fff}
.rail .dot.n{font-weight:700;font-size:.78rem;color:var(--rink)}
.rail .done .dot{background:#E4F4EA;border-color:var(--rgn);transform:none}
.rail .done .dot svg{stroke:var(--rgn);width:14px;height:14px}
.rail .done .dot.n{color:var(--rgn)}
.rail .rnew{flex:none;display:grid;gap:8px;margin-top:4px;padding:12px 2px 0;border-top:1px solid rgba(255,255,255,.5)}
.rail .railfoot{flex:none;margin-top:8px;padding:0 8px;font-size:.74rem;line-height:1.4;color:var(--rtx);opacity:1}
.rail:has(.rask) .railfoot{display:none}
.rbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:42px;padding:0 14px;border-radius:999px;border:1.5px solid #000;background:#fff;font-weight:700;font-size:.9rem;color:#000;transition:background .2s}
.rbtn:hover{background:#F1F1F1}
.rbtn svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.rbtn.go{background:#000;color:#fff}
.rbtn.go:hover{background:#333}
.rask{margin:0;padding:0 6px;font-size:.84rem;line-height:1.45;color:#fff}
.rrow{display:flex;flex-direction:column;gap:8px}
@media (max-height:44rem){.rail .ri small{display:none}.rail .ri{padding:6px 9px}.rail .rhead{padding-bottom:6px}.rail .rl{margin-top:6px}}
@media (prefers-reduced-motion:reduce){.rail{transition-duration:.01ms}}
.brand,.rail .brand{font-family:'New Century Schoolbook','Century Schoolbook','TeX Gyre Schola','C059','Century Schoolbook L',Georgia,serif;font-weight:700;color:var(--red);letter-spacing:.01em}
.toprow .brand{font-size:1.4rem}
.back{margin:0 0 12px;align-self:flex-start}
.temple{max-width:62rem;margin:0 auto}
.troof{height:clamp(64px,11vw,104px);background:var(--cd);clip-path:polygon(50% 0,100% 100%,0 100%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-family:var(--fd);font-weight:800;font-size:clamp(1.1rem,3vw,2rem);letter-spacing:.14em;color:var(--acc)}
.tcols{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,22px);padding:0 clamp(6px,2vw,28px);margin-top:6px}
.tcol{background:var(--cd);color:var(--cfg);border:0;border-radius:6px 6px 0 0;padding:clamp(10px,2vw,22px);text-align:left;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-height:clamp(210px,34vh,300px);transition:transform .2s,box-shadow .2s}
.tcol:hover,.tcol:focus-visible{transform:translateY(-6px);box-shadow:0 0 0 3px var(--acc)}
.tcol .no{font-family:var(--fd);font-weight:800;color:var(--acc);font-size:clamp(.75rem,1.3vw,.95rem)}
.tcol h3{font-family:var(--fd);font-size:clamp(.95rem,2vw,1.5rem);line-height:1.1;margin:0}
.tcol p{margin:0;font-size:clamp(.78rem,1.4vw,1rem);line-height:1.35}
.tcol .go{margin-top:auto;font-weight:700;color:var(--acc);font-size:clamp(.78rem,1.3vw,.95rem)}
.tb1,.tb2{background:var(--cd);border-radius:4px}
.tb1{height:clamp(10px,1.8vw,16px);margin:0 clamp(2px,1vw,12px)}
.tb2{height:clamp(12px,2.2vw,20px);margin:6px 0 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.cmpw{overflow-x:auto}
.cmp{width:100%;max-width:68rem;border-collapse:separate;border-spacing:0 10px}
.cmp th,.cmp td{background:var(--cd);color:var(--cfg);padding:16px 20px;text-align:left;vertical-align:top;line-height:1.4}
.cmp thead th{background:transparent;font-family:var(--fd);font-size:1.3rem;padding:0 20px 4px}
.cmp tbody th{width:19%;font-family:var(--fd);font-size:1.2rem;color:var(--acc);border-radius:18px 0 0 18px}
.cmp td:last-child{border-radius:0 18px 18px 0}
.cmp td b{display:block;font-family:var(--fd);font-weight:800;font-size:clamp(1.4rem,2.4vw,2rem);line-height:1.1;margin-bottom:4px}
.cmp td.ko b{color:#FF8A82}.cmp td.ok b{color:#5CCB91}
@media (max-width:40rem){.cmp th,.cmp td{padding:12px}.cmp{min-width:34rem}}
/* top + bottom bars */
.top{flex:none;border-bottom:1px solid var(--line);background:var(--chrome)}
.toprow{display:flex;align-items:center;gap:12px;min-height:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.where{font-weight:700;font-size:.95rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.pill{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 16px;min-height:44px;font-weight:700;font-size:.9rem;display:inline-flex;align-items:center;gap:8px;transition:background .2s,color .2s,border-color .2s}
.pill:hover{background:var(--red);border-color:var(--red);color:#fff}
.pill svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.prog{height:5px;background:var(--line)}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--coral),var(--sun));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.nav{flex:none;border-top:1px solid var(--line);background:var(--chrome)}
.navrow{display:flex;align-items:center;gap:14px;padding-top:12px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nb2{min-height:56px;min-width:8.5rem;border-radius:16px;font-weight:700;font-size:1.05rem;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s,background .2s,opacity .2s}
.nb2 svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.nb2.sec{border:2px solid var(--line);background:transparent}
.nb2.sec:hover{border-color:var(--red)}
.nb2.pri{border:0;background:var(--red);color:#fff;box-shadow:0 8px 18px -10px rgba(196,26,22,.9)}
.nb2.pri:hover{transform:translateY(-2px);background:var(--red-deep)}
.nb2[disabled]{opacity:.35;pointer-events:none}
.steps{flex:1;display:flex;justify-content:center;align-items:center;gap:7px;min-width:0;flex-wrap:wrap}
.steps i{width:10px;height:10px;border-radius:50%;background:var(--line);transition:background .3s,transform .3s}
.steps i.on{background:var(--red);transform:scale(1.35)}
.steps i.past{background:var(--coral)}

/* stage + slides */
.stage{flex:1;min-height:0;position:relative;overflow:hidden}
.sl{--bg:var(--paper);--fg:var(--ink);--acc:var(--accpaper);--cd:var(--card);--cfg:var(--ink);--mu:var(--muted);--b1:var(--blush);--b2:var(--blush);--bd:var(--red);--ln:var(--line);
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--bg);color:var(--fg);
  opacity:0;visibility:hidden;transform:translateX(5%);transition:opacity .4s,transform .4s cubic-bezier(.2,.8,.2,1),visibility 0s .4s}
.sl.before{transform:translateX(-5%)}
.sl.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.t-red{--bg:var(--red);--fg:#fff;--acc:#FFE3E0;--cd:var(--red-deep);--cfg:#fff;--mu:#FFD9D5;--b1:rgba(255,255,255,.13);--b2:rgba(0,0,0,.16);--bd:#fff;--ln:rgba(255,255,255,.3)}
.t-dark{--bg:#1E1E23;--fg:#F6F1EA;--acc:var(--coral);--cd:#2A2C35;--cfg:#F6F1EA;--mu:#B9B7C0;--b1:rgba(196,26,22,.3);--b2:rgba(255,255,255,.04);--ln:rgba(255,255,255,.2)}
.bg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;animation:drift 16s ease-in-out infinite alternate}
.b-a{width:62vmin;height:62vmin;right:-14vmin;top:-18vmin;background:var(--b1)}
.b-b{width:46vmin;height:46vmin;left:-14vmin;bottom:-20vmin;background:var(--b2);animation-delay:-6s}
@keyframes drift{to{transform:translate(-3vmin,4vmin) scale(1.07)}}
.in{position:relative;z-index:1;min-height:100%;max-width:75rem;margin:0 auto;display:flex;flex-direction:column;gap:22px;
  padding-top:clamp(20px,4.5vh,44px);padding-bottom:clamp(20px,4vh,36px);
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.on .rv{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms + 100ms)}
@keyframes rise{from{opacity:0;transform:translateY(20px)}}

/* type */
.kick{font-weight:700;font-size:.82rem;letter-spacing:.17em;text-transform:uppercase;color:var(--acc)}
.ttl{font-family:var(--fd);font-weight:700;font-size:clamp(1.9rem,3.4vw,3.1rem);line-height:1.06;letter-spacing:-.015em;margin:6px 0 0;text-wrap:balance}
.hero .ttl{font-weight:800;font-size:clamp(2.4rem,5.2vw,4.8rem);line-height:1;letter-spacing:-.03em}
.big{font-family:var(--fd);font-weight:800;font-size:clamp(4rem,11vw,9rem);line-height:.95;letter-spacing:-.035em;color:var(--acc);margin:8px 0 6px}
.t-red .big{color:#fff}
.sub{font-size:clamp(1.1rem,1.5vw,1.45rem);line-height:1.45;max-width:34em;margin:0}
.lead{font-size:clamp(1.1rem,1.5vw,1.4rem);line-height:1.5;max-width:38em;margin:12px 0 0}
.foots{font-weight:700;font-size:clamp(1.15rem,1.7vw,1.5rem);margin:0;max-width:38em}

/* layout */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.62fr);gap:34px;align-items:center;flex:1}
.head{display:flex;gap:16px;justify-content:space-between;align-items:flex-start}
.head>div:first-child{min-width:0}
.ill{background:var(--b1);border-radius:16%;padding:6%;width:100%;max-width:26rem;justify-self:end;animation:bob 5s ease-in-out infinite alternate}
.ill.sm{background:none;padding:0;width:clamp(80px,11vw,150px);flex:none;animation:none}
.ill svg{display:block;width:100%;height:auto}
@keyframes bob{to{transform:translateY(-8px) rotate(-1deg)}}
@media (max-width:56rem){.grid2{grid-template-columns:1fr;gap:18px}.ill{order:-1;max-width:11rem;justify-self:start}}

/* tiles + cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr));gap:14px}
.st{background:var(--cd);color:var(--cfg);border-radius:16px;padding:16px 18px;border-left:5px solid var(--bd)}
.st b{display:block;font-family:var(--fd);font-weight:800;font-size:clamp(1.6rem,2.6vw,2.2rem);line-height:1.1;color:var(--acc)}
.t-red .st b,.t-red .cd .n{color:#fff}
.st span{font-size:.95rem;color:var(--mu)}
.cds{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr));gap:16px}
.cds.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,20rem),1fr))}
.cd{background:var(--cd);color:var(--cfg);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:8px;min-width:0;text-align:left;border:0}
.ic{width:50px;height:50px;border-radius:50%;background:var(--red);display:grid;place-items:center;flex:none}
.t-red .ic{background:rgba(255,255,255,.18)}
.ic svg{width:26px;height:26px}
.cd h3{font-family:var(--fd);font-size:1.3rem;line-height:1.15;margin:4px 0 0;color:var(--acc)}
.t-red .cd h3{color:#fff}
.cd p{margin:0;line-height:1.45}
.cd .eg{font-size:.92rem;color:var(--mu);border-top:1px solid var(--ln);padding-top:10px;margin-top:auto}
.cd .nbx{margin-top:auto;padding-top:10px;border-top:1px solid var(--ln)}
.cd .n{display:block;font-family:var(--fd);font-weight:800;font-size:clamp(1.6rem,2.6vw,2.2rem);line-height:1.05;color:var(--acc)}
.cd .l{font-size:.92rem;color:var(--mu)}
.nw{border-top:6px solid var(--red)}
.nw .src{font-size:.76rem;font-weight:700;letter-spacing:.12em;color:var(--accpaper)}
.t-dark .nw .src{color:var(--coral)}
.nw h3{color:var(--cfg);font-size:1.2rem}
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr));gap:14px}
.terms.t4{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:36rem){.terms.t4{grid-template-columns:1fr}}
[hidden]{display:none!important}
.tm{background:var(--cd);color:var(--cfg);border-radius:18px;padding:16px 18px;border-left:5px solid var(--bd)}
.tm b{display:block;font-family:var(--fd);font-size:1.2rem;color:var(--acc);margin-bottom:2px}
.t-red .tm b{color:#fff}
.tm span{color:var(--mu);font-size:.98rem;line-height:1.45}
.tlab{font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin:6px 0 -6px}

/* bars */
.bars{display:grid;gap:18px;margin-block:auto}
.br{display:grid;grid-template-columns:minmax(8rem,14rem) minmax(0,1fr);gap:16px;align-items:center;font-size:1.1rem}
.trk{height:3.4rem;border-radius:2rem;background:rgba(127,127,127,.16);overflow:hidden}
.fill{height:100%;width:0;min-width:9rem;border-radius:2rem;display:flex;align-items:center;justify-content:flex-end;padding-right:20px;color:#fff;font-family:var(--fd);font-weight:800;font-size:1.3rem;white-space:nowrap}
.on .fill{width:var(--w);transition:width 1.3s cubic-bezier(.2,.8,.2,1) .35s}
.fill.navy{background:var(--navy)}.t-dark .fill.navy{background:#3A4F8A}
.fill.red{background:var(--red)}
@media (max-width:40rem){.br{grid-template-columns:1fr;gap:6px}}

/* story */
.story{display:grid;gap:12px;max-width:44rem}
.sp1{display:flex;gap:16px;align-items:flex-start;background:var(--cd);color:var(--cfg);border-radius:18px;padding:16px 18px;font-size:clamp(1.05rem,1.4vw,1.3rem);line-height:1.45}
.sp1 .no{flex:none;width:38px;height:38px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--fd);font-weight:800}
.t-red .sp1 .no{background:#fff;color:var(--red)}
.sp1{animation:rise .5s both}
.sp1.last{border:2px solid var(--red)}
.more{align-self:flex-start;border:0;background:var(--sun);color:#1F1F24;border-radius:999px;min-height:52px;padding:0 26px;font-weight:700;font-size:1.05rem;transition:transform .15s}
.more:hover{transform:translateY(-2px)}
.tag{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border:1.5px solid currentColor;border-radius:999px;padding:2px 10px;opacity:.8}

/* calc */
.calc{background:var(--cd);color:var(--cfg);border-radius:20px;padding:18px 20px;display:grid;gap:10px;max-width:46rem}
.calc label{font-weight:700}
.calc input[type=range]{width:100%;accent-color:var(--sun);height:34px}
.calc output{font-family:var(--fd);font-weight:800;font-size:1.5rem}
.rowc{display:flex;flex-wrap:wrap;gap:20px 36px}
.note{font-size:.88rem;color:var(--mu);margin:0}

/* compare */
.vs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,22rem),1fr));gap:16px}
.vs .cd h3{font-size:1.5rem}
.vs ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.vs li{display:flex;gap:10px;align-items:flex-start}
.vs li::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--red);margin-top:.55em}
.t-red .vs li::before{background:#fff}

/* check */
.chk{display:grid;gap:12px;max-width:52rem}
.cq{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;background:var(--cd);color:var(--cfg);border-radius:18px;padding:14px 18px}
.cq>span{flex:1 1 18rem;font-size:1.08rem;line-height:1.4}
.seg{display:flex;gap:6px}
.seg button{min-height:46px;min-width:4.4rem;border-radius:12px;border:2px solid var(--ln);background:transparent;font-weight:700;padding:0 14px;transition:background .15s,border-color .15s,color .15s}
.seg button:hover{border-color:var(--red)}
.seg button[aria-pressed="true"]{color:#fff;border-color:transparent}
.seg button[data-v="y"][aria-pressed="true"]{background:var(--leaf)}
.seg button[data-v="m"][aria-pressed="true"]{background:#B07A00}
.seg button[data-v="n"][aria-pressed="true"]{background:var(--red)}

/* hub */
.hubgrid{display:grid;gap:12px;max-width:62rem}
.hc{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--cd);color:var(--cfg);border-radius:20px;padding:14px 16px 14px 14px;border:2px solid transparent;transition:border-color .2s,transform .2s}
.hc.moved{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.025);border-color:var(--sun)}}
.hc:hover{border-color:var(--red)}
.rk{width:42px;height:42px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:1.2rem}
.hc.done .rk{background:var(--leaf)}
.rk svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.hc .tx{min-width:0}
.hc .ph{font-family:var(--fd);font-size:1.35rem;font-weight:700;line-height:1.1}
.hc .ps{font-size:.95rem;color:var(--mu)}
.hc .hq{font-size:.98rem;margin-top:2px}
.ctl{display:flex;gap:8px;align-items:center}
.mv{width:46px;height:46px;border-radius:12px;border:2px solid var(--ln);background:transparent;display:grid;place-items:center;transition:background .15s,border-color .15s}
.mv:hover:not([disabled]){background:var(--red);border-color:var(--red);color:#fff}
.mv[disabled]{opacity:.25;pointer-events:none}
.mv svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.open{min-height:46px;border:0;border-radius:12px;background:var(--red);color:#fff;font-weight:700;padding:0 18px;white-space:nowrap}
.hc.done .open{background:transparent;color:var(--cfg);border:2px solid var(--ln)}
.ltc{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between;border:2px dashed var(--ln);border-radius:20px;padding:14px 18px;max-width:62rem}
.ltc.ready{border-style:solid;border-color:var(--red);background:var(--cd)}
.hint{font-size:.95rem;color:var(--mu);margin:0}
@media (max-width:46rem){.hc{grid-template-columns:auto minmax(0,1fr);}.hc .ctl{grid-column:1/-1;justify-content:flex-end}}

/* end + final */
.ends{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr));gap:16px}
.tk{background:var(--cd);color:var(--cfg);border-radius:18px;padding:16px 18px;display:flex;gap:12px;align-items:flex-start;font-size:1.05rem;line-height:1.45}
.tk .ck{margin-top:2px}
.ck{flex:none;width:28px;height:28px;border-radius:50%;background:var(--red);display:grid;place-items:center}
.ck svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.tobe{background:var(--cd);color:var(--cfg);border-radius:18px;padding:16px 20px}
.tobe h3{margin:0 0 6px;font-family:var(--fd);font-size:1.15rem;color:var(--acc)}
.tobe ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.cta{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;background:#fff;color:var(--red);border:0;border-radius:999px;min-height:56px;padding:0 28px;font-weight:700;font-size:1.1rem;transition:transform .2s,box-shadow .2s}
.cta:hover{transform:scale(1.05);box-shadow:0 12px 26px -10px rgba(0,0,0,.5)}
.cta.red{background:var(--red);color:#fff}
.cta svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ft{margin-top:auto;padding-top:6px;font-size:.85rem;color:var(--mu)}
[id^="dyn-"]{display:flex;flex-direction:column;gap:22px;flex:1}

@media (max-width:56rem){
  .nb2{min-width:0;padding:0 16px}
  .steps{display:none}
  .nb2.pri{flex:1}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
  .on .fill{transition:none}
}
/* riepilogo finale */
.ranks{display:grid;gap:10px;max-width:52rem}
.rank{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;background:var(--cd);color:var(--cfg);border-radius:18px;padding:14px 18px}
.rn{width:36px;height:36px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--fd);font-weight:800}
.rt{min-width:0}
.rh{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline}
.rh b{font-family:var(--fd);font-size:1.2rem}
.rsub{color:var(--mu);font-size:.92rem}
.rank ul{margin:6px 0 0;padding-left:1.2em;display:grid;gap:3px}
.rank .rs{margin:6px 0 0;color:var(--mu)}
#calm-in{accent-color:var(--red)}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr));gap:14px;max-width:52rem}
.nt{display:grid;gap:6px;min-width:0}
.nt label{font-weight:700}
.nt textarea{width:100%;min-height:6.5rem;resize:vertical;border-radius:14px;border:1.5px solid var(--ln);background:var(--cd);color:var(--cfg);padding:12px 14px;font:inherit;line-height:1.4}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.actions .pill{min-height:56px;padding:0 22px;font-size:1rem}
.dlst{margin:0;min-height:1.4em;font-size:.95rem;color:var(--mu)}
.nt.cl{max-width:26rem}
.nt input[type=text]{width:100%;min-height:3rem;border-radius:14px;border:1.5px solid var(--ln);background:var(--cd);color:var(--cfg);padding:0 14px;font:inherit}
#fsBtn{padding:8px 12px}

<script>

/* ---------- helpers ---------- */

const allDone=()=>ORDER0.every(c=>st.done[c])&&st.done.ltc;

/* ---------- registro slide ---------- */

/* ---------- rendering delle slide ---------- */

  const s=r.def;

  case 'story': return head(s)+'<p class="rv" style="--i:2;margin:0"><span class="tag">'+esc(s.tag)+'</span></p><div class="story">'+s.steps.map((t,i)=>'<div class="sp1'+(i===s.steps.length-1?' last':'')+'" '+(i?'hidden':'')+'><span class="no">'+(i+1)+'</span><span>'+esc(t)+'</span></div>').join('')+'</div><button class="more rv" style="--i:4" type="button" data-act="more">E poi?</button>';

  case 'temple': return head(s)+'<div class="temple"><div class="troof rv" style="--i:2"><span>PENSIONE</span></div><div class="tcols">'+s.p.map((c,i)=>'<button type="button" class="tcol rv" style="--i:'+(i+3)+'" data-go="'+ANC(c.anc)+'"><span class="no">'+esc(c.n)+'</span><h3>'+esc(c.h)+'</h3><p>'+esc(c.p)+'</p><span class="go">Scopri di più →</span></button>').join('')+'</div><div class="tb1"></div><div class="tb2"></div></div><p class="hint rv" style="--i:7">'+esc(s.hint)+'</p>';

function makePdf(){
  const J=window.jspdf&&window.jspdf.jsPDF;
  if(!J)throw {code:'nolib'};
  const doc=new J({unit:'pt',format:'a4'}),W=595,M=50,CW=W-2*M,BOT=790,RED=[196,26,22],MU=[94,90,96];
  let y=M;
  const cl=s=>String(s).replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/…/g,'...').replace(/[–—]/g,'-');
  const need=h=>{if(y+h>BOT){doc.addPage();y=M}};
  const txt=(s,o)=>{o=o||{};
    const sz=o.size||11,x=o.x||M,w=o.w||CW,lh=sz*1.4;
    doc.setFont('helvetica',o.bold?'bold':'normal');doc.setFontSize(sz);doc.setTextColor(...(o.col||[31,31,36]));
    doc.splitTextToSize(cl(s),w).forEach(l=>{need(lh);doc.text(l,x,y+sz);y+=lh});
    y+=o.gap||0};
  const head=s=>{y+=10;need(40);txt(s.toUpperCase(),{size:10,bold:true,col:RED,gap:6})};

  txt('Il tuo piano di protezione',{size:24,bold:true,col:RED,gap:2});
  {const nm=(st.client||'').trim();if(nm)txt('Consulenza per '+nm,{size:13,bold:true,gap:2})}
  txt('Riepilogo della consulenza del '+fmtDate(),{size:10,col:MU,gap:8});
  doc.setDrawColor(231,218,209);doc.setLineWidth(.8);doc.line(M,y,W-M,y);y+=6;

  head('Argomenti in ordine di importanza');
  rankList().forEach((c,i)=>{
    const d=CHAP[c],t=todo(c),dn=!!st.done[c],ans=checkItems(c).some((q,k)=>st.ans[c+'.'+k]);
    need(60);
    txt((i+1)+'. '+d.name,{size:13,bold:true});
    txt(c==='ltc'?'Ultimo argomento':d.sub,{size:10,col:MU,x:M+16,w:CW-16,gap:2});
    if(t.length)t.forEach(x=>txt('- '+x.q+' ('+(x.a==='n'?'No':'Non so')+')',{size:10.5,x:M+16,w:CW-16}));
    else txt(ans?'Situazione a posto su quanto segnato.':(dn?'Nessuna risposta segnata.':'Non ancora affrontato.'),{size:10.5,col:MU,x:M+16,w:CW-16});
    y+=8;
  });

  head('Cifra di massima tranquillità');
  need(100);
  doc.setFillColor(249,225,220);doc.roundedRect(M,y,CW,84,10,10,'F');
  const y0=y;y+=14;
  txt(fmtI(st.calm)+' euro al mese',{size:24,bold:true,col:RED,x:M+18,w:CW-36,gap:2});
  txt("Circa "+fmtI(st.calm*12)+" euro l'anno: la cifra che posso dedicare alla mia protezione restando sereno.",{size:10,col:MU,x:M+18,w:CW-36});
  y=y0+84+10;

  head('Note per il consulente');
  [0,1].forEach(k=>{
    need(60);
    txt('Nota '+(k+1),{size:11,bold:true,gap:2});
    txt((st.notes[k]||'').trim()||'-',{size:11,col:(st.notes[k]||'').trim()?[31,31,36]:MU,gap:10});
  });

  y+=6;
  txt('Documento di supporto alla consulenza. Cifre e valutazioni sono indicative e non costituiscono un preventivo.',{size:9,col:MU});
  const n=doc.getNumberOfPages();
  for(let p=1;p<=n;p++){doc.setPage(p);doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(...MU);doc.text('Pagina '+p+' di '+n,W/2,820,{align:'center'})}
  return doc.output('arraybuffer');
}

async function downloadPdf(){

    if(DL){await DL.save({filename:fname,data:buf});say('Riepilogo salvato.')}
    else{const u=URL.createObjectURL(new Blob([buf],{type:'application/pdf'})),a=document.createElement('a');a.href=u;a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);say('Riepilogo scaricato.')}
  }catch(err){

}

<script>

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- contatori animati ---------- */
function parse(v){
  const m=v.match(/^(\+?)(\d{1,3}(?:\.\d{3})+|\d+(?:,\d+)?)(.*)$/);if(!m)return null;
  if(!/^[\s%€°]*(mln|mld|anni|punti|redditi)?[\s%€]*$/.test(m[3]))return null;
  const th=/\./.test(m[2]);
  return {pre:m[1],th,dec:th?0:(m[2].split(',')[1]||'').length,val:parseFloat(th?m[2].replace(/\./g,''):m[2].replace(',','.')),suf:m[3]};
}
function fmt(p,x){let s=p.dec?x.toFixed(p.dec).replace('.',','):String(Math.round(x));if(p.th)s=s.replace(/\B(?=(\d{3})+(?!\d))/g,'.');return p.pre+s+p.suf}
function runCounters(el,id){
  if(reduce)return;
  el.querySelectorAll('.cnt').forEach(c=>{
    const v=c.dataset.v,p=parse(v);if(!p||p.val===0)return;
    const t0=performance.now()+200,D=1000;
    (function step(t){const k=Math.min(1,Math.max(0,(t-t0)/D)),e=1-Math.pow(1-k,3);
      c.textContent=k<1?fmt(p,p.val*e):v;
      if(k<1&&cur===id)requestAnimationFrame(step);else c.textContent=v})(performance.now());
  });
}

/* ---------- navigazione ---------- */
function nextId(id){const r=REG[IDX[id]];
  if(r.grp==='intro')return r.i<r.n-1?'intro-'+(r.i+2):'hub';
  if(r.grp==='hub')return startTarget();
  if(r.grp==='ch')return r.i<r.n-1?r.ch+'-'+(r.i+2):(allDone()?'final':'hub');
  return null}
function prevId(id){const r=REG[IDX[id]];
  if(r.grp==='intro')return r.i>0?'intro-'+r.i:null;
  if(r.grp==='hub')return 'intro-'+INTRO.length;
  if(r.grp==='ch')return r.i>0?r.ch+'-'+r.i:'hub';
  return 'hub'}

function resetStory(el){const s=el.querySelectorAll('.sp1');if(!s.length)return;s.forEach((x,i)=>x.hidden=i>0);const b=el.querySelector('[data-act="more"]');if(b)b.hidden=false}

function show(id){
  if(!(id in IDX))id='intro-1';
  const r=REG[IDX[id]];
  cur=id;if(rail.classList.contains('shown'))setRail(false);

  resetStory(els[IDX[id]]);
  const k=IDX[id];
  els.forEach((e,j)=>{e.classList.toggle('on',j===k);e.classList.toggle('before',j<k);e.inert=j!==k;e.setAttribute('aria-hidden',j!==k?'true':'false')});
  els[k].scrollTop=0;
  refreshRail(id);
  updateNav(r,id);
  try{history.replaceState(null,'','#'+id)}catch(e){}
  runCounters(els[k],id);
}

function updateNav(r,id){
  const w=$('where'),dots=$('steps'),nx=nextId(id),pv=prevId(id);
  let label='Avanti',frac=0;
  if(r.grp==='intro'){w.textContent='Introduzione';dots.innerHTML=Array.from({length:r.n},(_,i)=>'<i class="'+(i===r.i?'on':i<r.i?'past':'')+'"></i>').join('')}
  else if(r.grp==='hub'){w.textContent='Panoramica';dots.innerHTML='';const t=startTarget();label=t==='final'?'Vai al riepilogo':t==='ltc-1'?'Ultimo argomento':'Parti da: '+CHAP[t.split('-')[0]].name}
  else if(r.grp==='ch'){w.textContent=CHAP[r.ch].name+' · '+(r.i+1)+' di '+r.n;frac=(r.i+1)/r.n;dots.innerHTML=Array.from({length:r.n},(_,i)=>'<i class="'+(i===r.i?'on':i<r.i?'past':'')+'"></i>').join('');if(r.def.y==='end')label=allDone()?'Vai al riepilogo':'Torna alla panoramica'}
  else{w.textContent='Riepilogo';dots.innerHTML=''}
  const n=ORDER0.concat(['ltc']).filter(c=>st.done[c]).length;
  const p=r.grp==='final'?100:r.grp==='intro'?1:Math.max(1,(n+(r.grp==='ch'&&!st.done[r.ch]?frac:0))/5*100);
  $('progi').style.width=Math.min(100,p)+'%';
  $('nextl').textContent=label;
  $('next').disabled=!nx;$('prev').disabled=!pv;
}
const go=id=>{if(id)show(id)};
$('next').onclick=()=>go(nextId(cur));
$('prev').onclick=()=>go(prevId(cur));
$('homeBtn').onclick=()=>show('hub');
const fsBtn=$('fsBtn');
const FS_IN='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
const FS_OUT='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
function fsSync(){const on=!!document.fullscreenElement;fsBtn.innerHTML=on?FS_OUT:FS_IN;const t=on?'Esci dallo schermo intero':'Schermo intero';fsBtn.setAttribute('aria-label',t);fsBtn.title=t}
if(document.fullscreenEnabled&&document.documentElement.requestFullscreen){fsBtn.hidden=false;fsSync()}
fsBtn.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){fsBtn.hidden=true}};
document.addEventListener('fullscreenchange',fsSync);

const rail=$('rail'),scrim=$('scrim'),menuBtn=$('menuBtn');rail.inert=true;
function setRail(o){rail.classList.toggle('shown',o);scrim.classList.toggle('shown',o);rail.inert=!o;menuBtn.setAttribute('aria-expanded',String(o));
  if(o){const f=rail.querySelector('[aria-current="true"]')||rail.querySelector('button');if(f)f.focus()}else if(rail.contains(document.activeElement))menuBtn.focus()}
/* click su tutta l'app */
document.addEventListener('click',e=>{
  if(e.target===scrim){setRail(false);return}
  if(e.target.closest('[data-act="menu"]')){setRail(!rail.classList.contains('shown'));return}
  const nw=e.target.closest('[data-new]');
  if(nw){const a=nw.dataset.new;if(a==='yes'){doReset();return}resetAsk=(a==='ask');refreshRail(cur);const f=rail.querySelector('[data-new]');if(f)f.focus();return}
  if(e.target.closest('[data-act="dl"]')){downloadPdf();return}
  const g=e.target.closest('[data-go]');if(g){show(g.dataset.go);return}
  if(e.target.closest('[data-act="next"]')){go(nextId(cur));return}
  const m=e.target.closest('[data-act="more"]');
  if(m){const sec=m.closest('.sl'),hid=[...sec.querySelectorAll('.sp1[hidden]')];if(hid.length){hid[0].hidden=false;hid[0].scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'})}if(hid.length<=1)m.hidden=true;return}
  const v=e.target.closest('.seg [data-v]');
  if(v){const seg=v.parentElement,k=seg.dataset.k;st.ans[k]=st.ans[k]===v.dataset.v?undefined:v.dataset.v;if(!st.ans[k])delete st.ans[k];save();seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(st.ans[k]===b.dataset.v)));return}
  const mv=e.target.closest('[data-mv]');
  if(mv){const [c,d]=mv.dataset.mv.split(':'),i=st.order.indexOf(c),j=i+(+d);if(j<0||j>3)return;
    [st.order[i],st.order[j]]=[st.order[j],st.order[i]];save();
    $('hubList').innerHTML=hubList(false,c);refreshRail(cur);updateNav(REG[IDX[cur]],cur);
    const nb=document.querySelector('[data-mv="'+c+':'+d+'"]:not([disabled])')||document.querySelector('[data-mv="'+c+':'+(-d)+'"]:not([disabled])');if(nb)nb.focus()}
});

/* tastiera e swipe */
addEventListener('keydown',e=>{
  if(e.key==='Escape'&&rail.classList.contains('shown')){setRail(false);return}
  if(e.target.matches('input,textarea'))return;
  if(e.key==='ArrowRight'||e.key==='PageDown')go(nextId(cur));
  else if(e.key==='ArrowLeft'||e.key==='PageUp')go(prevId(cur));
});
let tx=0,ty=0;
deck.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
deck.addEventListener('touchend',e=>{
  if(e.target.closest('input,textarea'))return;
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6)go(dx<0?nextId(cur):prevId(cur));
},{passive:true});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h in IDX&&h!==cur)show(h)});

show((location.hash.slice(1) in IDX)?location.hash.slice(1):'intro-1');
</script>
